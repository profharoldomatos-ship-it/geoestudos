<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>GeoNotas</title>
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone-192.png">
<meta name="theme-color" content="#F4ECD8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700&display=swap">
<style>
:root{
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --ok:#1F7A45; --ok-bg:#E3F3E8; --mid:#8A5A00; --mid-bg:#F6E3A6;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04); color-scheme:light;
}
/* mesmas cores dos modos Sépia e Claro do GeoEstudos */
body,body.t-sepia{--bg:#F4ECD8;--card:#FAF4E4;--field:#F4ECD8;--ink:#3B2F22;--muted:#54483A;--line:#DCCFB2;--brand:#2B4A8A;--brand-ink:#FFFFFF;--accent:#9A3A2A;--low:#9A3A2A;--low-bg:#F6E1D8}
body.t-claro{--bg:#FBF8F1;--card:#FFFDF8;--field:#FBF8F1;--ink:#26303F;--muted:#4A5260;--line:#E3DCCB;--brand:#1D3F8F;--brand-ink:#FFFFFF;--accent:#A33A2C;--low:#A33A2C;--low-bg:#FBE6E3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--body)}
button{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:10;background:var(--bg);padding:10px 16px 0;border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:8px}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.01em;line-height:1.1}
.brand small{display:block;font-family:var(--body);font-weight:400;color:var(--muted);font-size:12px;letter-spacing:0}
.spacer{flex:1}
.sync{font-size:12px;color:var(--muted);white-space:nowrap}
.sync.err{color:var(--low)} .sync.busy{color:var(--accent)}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer}
.chips{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;padding:10px 0 8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 0;font-weight:700;font-size:16px;cursor:pointer;text-align:center}
.chip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.tabs{display:flex;gap:2px}
.tab{flex:1;border:0;background:none;padding:10px 4px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer}
.tab.on{color:var(--brand);border-bottom-color:var(--brand)}
main{padding:12px 16px 90px;max-width:760px;margin:0 auto}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:9px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--brand);color:var(--brand-ink)}
select{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line);min-height:52px}
.row:first-child{border-top:0}
.row.tap{cursor:pointer}
.num{width:22px;color:var(--muted);font-size:12px;text-align:right;flex:0 0 auto}
.name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx{font-size:12px;color:var(--muted);flex:0 0 auto;min-width:40px;text-align:right}
.inp{width:68px;flex:0 0 auto;text-align:center;font:inherit;font-weight:600;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:8px 4px}
.inp:focus{outline:2px solid var(--brand);border-color:transparent}
.inp.saving{border-color:var(--accent)} .inp.bad{border-color:var(--low);color:var(--low)}
.tog{width:68px;height:38px;flex:0 0 auto;border-radius:10px;border:1px solid var(--line);background:var(--field);cursor:pointer;font-weight:700;color:var(--muted)}
.tog.on{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.tog.saving{opacity:.55}
.calc{min-width:44px;text-align:center;font-weight:700;border-radius:8px;padding:4px 6px;flex:0 0 auto}
.g-ok{background:var(--ok-bg);color:var(--ok)} .g-low{background:var(--low-bg);color:var(--low)} .g-mid{background:var(--mid-bg);color:var(--mid)}
.g-none{color:var(--muted)}
.hint{color:var(--muted);font-size:13px;margin:4px 2px 10px}
.empty,.loading{padding:40px 16px;text-align:center;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--muted)}
.tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:700;position:sticky;top:0;background:var(--card)}
td.nm,th.nm{text-align:left;position:sticky;left:0;background:var(--card);max-width:150px;overflow:hidden;text-overflow:ellipsis}
/* folha do aluno */
.sheet{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;flex-direction:column}
.sheet.open{display:flex}
.sheet header{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--bg)}
.sheet header .t{flex:1;min-width:0}
.sheet header .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet header .t span{font-size:12px;color:var(--muted)}
.sheet .body{overflow-y:auto;padding:12px 16px 40px;flex:1}
.grp{margin:14px 2px 6px;font-size:12px;font-weight:700;color:var(--brand);text-transform:uppercase;letter-spacing:.4px}
.field{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line)}
.field:first-child{border-top:0}
.field .lb{flex:1;min-width:0}
 .iconbtn.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
a.iconbtn{color:inherit}
.privnav{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.privnav select{margin:0;flex:1;font-weight:700}
.privnav .iconbtn{width:44px;height:44px;flex:none;font-size:20px}
.privtag{display:flex;align-items:center;gap:8px;background:var(--card);border:1px dashed var(--brand);color:var(--brand);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:700;margin-bottom:10px}
 .impbtn{display:flex;align-items:center;gap:10px;width:100%;border:1px dashed var(--brand);background:var(--card);color:var(--brand);border-radius:12px;padding:10px 12px;font-weight:700;margin-bottom:10px;cursor:pointer;text-align:left}
.formbtn{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:12px;text-align:left;cursor:pointer}
.formbtn:first-child{border-top:0}
.formbtn b{display:block}.formbtn span{font-size:13px;color:var(--muted)}
.improw{padding:10px 12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.improw:first-child{border-top:0}
.improw.off{opacity:.5}
.imp-t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.imp-t b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imp-m{font-size:12px;color:var(--muted)}
.improw select{margin:0;padding:8px 10px;font-size:15px}
.tag{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}
.tag.certo{background:var(--ok-bg);color:var(--ok)}.tag.duvida{background:var(--mid-bg);color:var(--mid)}.tag.nenhum{background:var(--low-bg);color:var(--low)}
.impok{position:sticky;bottom:0;background:var(--bg);padding:12px 0 4px;border-top:1px solid var(--line);margin-top:12px}
.impok button{width:100%;font:inherit;font-weight:700;border:0;border-radius:12px;padding:13px;background:var(--brand);color:var(--brand-ink);cursor:pointer}
.impok button:disabled{opacity:.5}
.rs-head{display:grid;gap:4px;padding:0 12px 6px;font-size:11px;font-weight:700;color:var(--muted);text-align:center}
.rs-row{padding:9px 12px;border-top:1px solid var(--line);cursor:pointer}
.rs-row:first-child{border-top:0}
.rs-nome{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px;font-size:15px}
.rs-vals{display:grid;gap:4px}
.rs-vals .calc{min-width:0;font-size:14px;padding:3px 0}
.calc.forte{outline:1.5px solid currentColor;outline-offset:-1.5px}
.chips2{display:grid;gap:6px;margin-bottom:10px}
.chips2 .chip{padding:8px 0;font-size:14px;border-radius:999px}
.ctl{display:flex;gap:6px;flex:0 0 auto}
.ctl.par .tog,.ctl.par .inp{width:54px}
.sec-t{margin:16px 2px 4px;font-family:var(--display);font-size:17px;font-weight:700}
.bl-head{display:flex;justify-content:space-between;align-items:center;margin:10px 2px 6px}
.bl-head .grp{margin:0}
.bloco{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.bloco .bl-nome{font-weight:700}
.bloco .calc{font-size:18px;min-width:56px}
.obs-txt{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;resize:vertical;margin:4px 0 8px}
.obs-txt:focus{outline:2px solid var(--brand);border-color:transparent}
.obs-btn{width:100%;font:inherit;font-weight:700;border:0;border-radius:12px;padding:11px;background:var(--brand);color:var(--brand-ink);cursor:pointer;margin-bottom:10px}
.obs-btn:disabled{opacity:.6}
.obs-it{padding:10px 12px;border-top:1px solid var(--line)}
.obs-it:first-child{border-top:0}
.obs-q{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:3px}
.obs-del{border:0;background:none;color:var(--low);font-size:12px;cursor:pointer;padding:0}
.obs-t{white-space:normal;word-wrap:break-word}
.ch-dia{display:flex;gap:6px;align-items:center;margin-bottom:10px}
.ch-dia select{margin:0;flex:1;font-weight:700;min-width:0}
.ch-dia .iconbtn{flex:none;width:40px;height:44px;font-size:20px}
.na-btn{flex:none;height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700;color:var(--muted);cursor:pointer}
.na-btn.on{background:var(--mid-bg);border-color:var(--mid);color:var(--mid)}
.na-box{background:var(--card);border:1px solid var(--mid);border-radius:14px;padding:12px;margin-bottom:10px;display:flex;flex-direction:column;gap:8px}
.na-op{display:flex;flex-wrap:wrap;gap:6px}
.na-op button{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.na-op button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.na-op.mot button{font-size:13px;color:var(--muted)}
.na-acts{display:flex;justify-content:space-between;align-items:center;gap:10px}
.na-acts .obs-btn{width:auto;padding:10px 18px;margin-left:auto}
.lnk{border:0;background:none;color:var(--low);font-weight:700;cursor:pointer;padding:0}
.ch-row .name{display:flex;align-items:center;gap:6px}
.ch-row .name{white-space:nowrap}
.ch-al{font-size:11px;font-weight:700;border-radius:6px;padding:1px 5px;flex:none}
.pf{display:flex;gap:4px;flex:none}
.pf button{width:40px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--field);font-weight:700;color:var(--muted);cursor:pointer;font-size:13px}
.pf .pf-P.on{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.pf .pf-F.on{background:var(--low-bg);border-color:var(--low);color:var(--low)}
.pf .pf-FJ.on{background:var(--mid-bg);border-color:var(--mid);color:var(--mid)}
.ch-tot{position:sticky;bottom:0;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;background:var(--bg);border-top:1px solid var(--line);padding:10px 2px;margin-top:10px;font-size:14px}
.ch-st{margin-left:auto;font-size:12px;color:var(--muted)}
.link-d{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:2px 6px;margin:2px;cursor:pointer;font-size:13px}
.foot{margin:24px 0 0;text-align:center;font-size:13px;color:var(--muted)}
.foot button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;margin:0 3px;cursor:pointer}
.foot button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;z-index:50;max-width:90vw;display:none}
.toast.show{display:block}
.login{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px}
.login.open{display:flex}
.login form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px}
.login h1{margin:0;font-size:24px}
.login p{margin:0;color:var(--muted);font-size:14px}
.login input{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.login button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px;background:var(--brand);color:var(--brand-ink);cursor:pointer}
.login button:disabled{opacity:.6}
.login .err{color:var(--low);font-weight:600;min-height:1.2em}
</style>
</head>
<body>
<div class="top">
  <div class="bar">
    <a class="iconbtn" href="../?professor=1" title="Voltar ao GeoEstudos" aria-label="Voltar ao painel do GeoEstudos" style="text-decoration:none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div class="brand">GeoNotas<small><span id="sub"></span> <span class="sync" id="sync"></span></small></div>
    <div class="spacer"></div>
    <button class="iconbtn" id="privBtn" title="Um aluno por vez" aria-label="Mostrar um aluno por vez" aria-pressed="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
    </button>
    <button class="iconbtn" id="refresh" title="Atualizar da planilha" aria-label="Atualizar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
    <button class="iconbtn" id="logout" title="Sair" aria-label="Sair">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
    </button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="tabs" id="tabs">
    <button class="tab on" data-k="notas">Notas</button>
    <button class="tab" data-k="cadernos">Cadernos</button>
    <button class="tab" data-k="chamada">Chamada</button>
    <button class="tab" data-k="final">Resultados</button>
  </div>
</div>
<main id="main"><div class="loading">Carregando…</div></main>

<div class="sheet" id="sheet">
  <header>
    <button class="iconbtn" id="sClose" aria-label="Fechar">✕</button>
    <div class="t"><b id="sName"></b><span id="sSub"></span></div>
    <button class="iconbtn" id="sPrev" aria-label="Anterior">‹</button>
    <button class="iconbtn" id="sNext" aria-label="Próximo">›</button>
  </header>
  <div class="body" id="sBody"></div>
</div>
<div class="sheet" id="imp">
  <header>
    <button class="iconbtn" id="impClose" aria-label="Fechar">✕</button>
    <div class="t"><b id="impTit">Importar dos formulários</b><span id="impSub"></span></div>
  </header>
  <div class="body" id="impBody"></div>
</div>
<div class="toast" id="toast"></div>
<div class="login" id="login">
  <form id="loginForm" autocomplete="on">
    <h1>GeoNotas</h1>
    <p>Acesso exclusivo do Prof. Haroldo Matos.</p>
    <p><a href="../?professor=1" style="color:var(--brand);font-weight:600">‹ Voltar ao GeoEstudos</a></p>
    <input type="text" name="username" value="GeoNotas" autocomplete="username" hidden>
    <input id="senha" type="password" placeholder="Senha" autocomplete="current-password" required>
    <button id="entrar" type="submit">Entrar</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<script>
const S = {
  cfg:null, turma:null, kind:'notas', mode:'resumo', modeC:'atividade',
  data:{},            // data[turma][kind] = {columns, rows, fetchedAt}
  colSel:{},          // coluna escolhida por turma+kind
  pending:0, openRow:null
};
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = {
  get(k){try{return localStorage.getItem('geonotas.'+k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem('geonotas.'+k,v)}catch(e){}}
};

/* Robô do GeoNotas (Google Apps Script). Todas as chamadas levam a chave de entrada;
   se ela venceu, o app volta para a tela de senha. */
const ROBO='https://script.google.com/macros/s/AKfycbzROyyYqz_L8kad5ACUtsz51j98fQG0DFhoD1sCAtt-Y-8jBaKqNwMu15D1NRAdtBiU/exec';
async function api(acao,extra){
  let j;
  try{
    const r=await fetch(ROBO,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({acao,token:store.get('token')},extra||{}))});
    j=await r.json();
  }catch(e){throw new Error('Sem conexão com o robô. Tente de novo com internet.')}
  if(!j.ok){if(j.sessao===false){store.set('token','');showLogin()}throw new Error(j.erro||'Erro no robô.')}
  return j;
}
function showLogin(){$('#login').classList.add('open');setTimeout(()=>$('#senha').focus(),80)}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),3500)}
function setSync(txt,cls){const s=$('#sync');s.textContent=txt;s.className='sync '+(cls||'')}

/* ---------- números e cores ---------- */
function num(v){
  if(v===''||v==null||typeof v==='boolean')return null;
  const s=String(v).trim();
  if(s.startsWith('#'))return null;
  const n=Number(s.includes(',')?s.replace(/\./g,'').replace(',','.'):s);
  return isNaN(n)?null:n;
}
function shown(v){if(typeof v==='boolean')return v?'✓':'—';const s=String(v||'');return !s||s.startsWith('#')?'—':s}
function grade(v){const n=num(v);if(n==null)return 'g-none';return n>=7?'g-ok':'g-low'}
function parseInput(s){
  s=String(s).trim();
  if(s==='')return {ok:true,v:''};
  const n=Number(s.replace(',','.'));
  if(isNaN(n)||n<0)return {ok:false};
  return {ok:true,v:n};
}

/* ---------- dados ---------- */
function cur(){return (S.data[S.turma]||{})[S.kind]}
async function load(turma,kind,quiet){
  if(!quiet){$('#main').innerHTML='<div class="loading">Lendo a planilha da '+esc(turma)+'…</div>'}
  setSync('lendo…','busy');
  try{
    const d=kind==='chamada'?Object.assign((await api('chamada',{turma})).chamada,{fetchedAt:new Date().toISOString()}):(await api('dados',{turma,kind})).dados;
    (S.data[turma]=S.data[turma]||{})[kind]=d;
    setSync('atualizado '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}));
    if(turma===S.turma&&kind===S.kind)render();
    if(S.openRow!=null&&turma===S.turma&&kind===S.kind)renderSheet();
  }catch(e){
    setSync('erro','err');
    if(!quiet)$('#main').innerHTML='<div class="empty">Não consegui ler a planilha.<br>'+esc(e.message||e)+'</div>';
    else toast(e.message||String(e));
  }
}
function ensure(){const d=cur();if(d){render();}else load(S.turma,S.kind);}

/* colunas-chave: médias/finais calculadas, para dar contexto */
function keyCols(d){return d.columns.filter(c=>c.calc&&/FINAL|M[ÉE]DIA/i.test(c.label))}
function keyVal(d,row){
  const ks=keyCols(d);
  for(let i=ks.length-1;i>=0;i--){const v=row.cells[ks[i].c].v;if(num(v)!=null)return {v,col:ks[i]};}
  return null;
}
function inputCols(d){return d.columns.filter(c=>!c.calc)}

/* coluna padrão nos cadernos: capítulo com a data mais recente já passada */
function defaultCol(d){
  const cols=inputCols(d);
  if(S.kind!=='cadernos')return cols[0];
  const today=new Date();let best=null,bestT=-Infinity;
  cols.forEach(c=>{c.parts.forEach(p=>{const m=p.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m){const t=new Date(+m[3],m[2]-1,+m[1]);if(t<=today&&t>bestT){bestT=t;best=c}}})});
  return best||cols[0];
}

/* ---------- gravação ---------- */
async function save(row,col,value,el){
  const d=cur(), turma=S.turma, kind=S.kind;
  S.pending++;setSync('salvando…','busy');el&&el.classList.add('saving');
  try{
    const fresh=(await api('salvar',{turma,kind,row:row.r,col:col.c,value,nome:row.nome})).linha;
    const dd=S.data[turma][kind];
    const i=dd.rows.findIndex(x=>x.r===row.r);
    if(i>=0){Object.keys(dd.rows[i].cells).forEach(k=>{if(fresh.cells[k])dd.rows[i].cells[k]=fresh.cells[k]})}
    // cadernos alteram a nota de caderno na aba de notas
    if(kind==='cadernos'&&S.data[turma])delete S.data[turma].notas;
    if(kind==='notas'&&S.data[turma])delete S.data[turma].final;
    patchRow(dd.rows[i]);
    setSync('salvo ✓');
  }catch(e){
    setSync('erro','err');toast(e.message||String(e));
    el&&el.classList.add('bad');
    load(turma,kind,true); // ressincroniza com o que está de fato na planilha
  }finally{
    S.pending--;el&&el.classList.remove('saving');
  }
}

/* atualiza na tela os valores de uma linha sem perder o foco de digitação */
function patchRow(row){
  if(!row)return;
  document.querySelectorAll('[data-r="'+row.r+'"]').forEach(el=>{
    const c=el.dataset.c, cell=row.cells[c];
    if(c==='key'){const k=keyVal(cur(),row);el.textContent=k?shown(k.v):'—';if(el.classList.contains('calc'))el.className='calc '+(k?grade(k.v):'g-none');return}
    if(!cell)return;
    if(el.classList.contains('inp')){if(el!==document.activeElement){el.value=shown(cell.v)==='—'?'':cell.v;el.classList.remove('bad')}}
    else if(el.classList.contains('tog')){el.classList.toggle('on',cell.v===true);el.textContent=cell.v===true?'✓':'—'}
    else{el.textContent=shown(cell.v);el.className=(el.classList.contains('ctx')?'ctx':'calc '+(typeof cell.v==='boolean'?'g-none':grade(cell.v)))+(el.classList.contains('forte')?' forte':'')}
  });
}

/* ---------- controles de lançamento ---------- */
function control(row,col){
  const cell=row.cells[col.c];
  const attrs='data-r="'+row.r+'" data-c="'+col.c+'"';
  if(!cell.ed)return '<span class="calc '+grade(cell.v)+'" '+attrs+'>'+esc(shown(cell.v))+'</span>';
  if(col.check)return '<button class="tog'+(cell.v===true?' on':'')+'" '+attrs+'>'+(cell.v===true?'✓':'—')+'</button>';
  const val=shown(cell.v)==='—'?'':cell.v;
  return '<input class="inp" inputmode="decimal" enterkeyhint="next" autocomplete="off" value="'+esc(val)+'" '+attrs+'>';
}
function bindControls(root,rowsById,colsById){
  root.querySelectorAll('.tog').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();
    const row=rowsById(b.dataset.r), col=colsById(b.dataset.c);
    const nv=!(row.cells[col.c].v===true);
    row.cells[col.c].v=nv;b.classList.toggle('on',nv);b.textContent=nv?'✓':'—';
    save(row,col,nv,b);
  }));
  root.querySelectorAll('.inp').forEach(inp=>{
    inp.addEventListener('click',e=>e.stopPropagation());
    inp.addEventListener('focus',()=>{inp.dataset.orig=inp.value;inp.select()});
    inp.addEventListener('keydown',e=>{
      if(e.key==='Enter'){e.preventDefault();const all=[...root.querySelectorAll('.inp')];const i=all.indexOf(inp);(all[i+1]||inp).focus();if(!all[i+1])inp.blur()}
    });
    inp.addEventListener('blur',()=>{
      if(inp.value===inp.dataset.orig)return;
      const p=parseInput(inp.value);
      if(!p.ok){inp.classList.add('bad');toast('Valor inválido: use números como 7,5');return}
      if(p.v!==''&&p.v>10)toast('Atenção: valor acima de 10 gravado.');
      inp.classList.remove('bad');
      const row=rowsById(inp.dataset.r), col=colsById(inp.dataset.c);
      save(row,col,p.v,inp);
    });
  });
}

const byCol=d=>id=>d.columns.find(c=>c.c==id);

/* ---------- telas ---------- */
/* ===== Chamada =====
   P presente · F falta · FJ falta justificada · NA não houve aula (dia todo ou parte, com justificativa).
   A falta conta por aula: num dia de dois tempos, faltar vale 2. */
const CH={sub:'dia',dia:{},edit:{},timer:null,naAberto:false};
const pad2=n=>String(n).padStart(2,'0');
const isoDe=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const brDe=iso=>iso.slice(8,10)+'/'+iso.slice(5,7)+'/'+iso.slice(0,4);
const SEM='(SEM AULA)';
const DSEM=['dom','seg','ter','qua','qui','sex','sáb'];
function diasAula(turma){
  const c=S.cfg.chamada;if(!c)return [];
  const p=s=>{const[a,m,d]=s.split('-').map(Number);return new Date(a,m-1,d)};
  const hoje=new Date();hoje.setHours(0,0,0,0);
  const fim=p(c.fim)<hoje?p(c.fim):hoje,out=[];
  for(let d=p(c.inicio);d<=fim;d.setDate(d.getDate()+1)){
    const t=(c.horario[d.getDay()]||[]).filter(x=>x===turma).length;
    if(t){const iso=isoDe(d);out.push({iso,br:brDe(iso),tempos:t,wd:d.getDay(),feriado:c.feriados[iso]||''})}
  }
  return out;
}
/* registros salvos, por dia, com as edições ainda não salvas por cima */
function chDia(d,br,turma){
  const r={na:null,st:{},aulas:null,salvo:false};
  d.registros.forEach(x=>{if(x[0]!==br)return;r.salvo=true;
    if(x[1]===SEM)r.na={aulas:+x[3]||0,obs:x[4]||''};else{r.st[x[1]]=x[2];r.aulas=+x[3]||0}});
  const e=CH.edit[(turma||S.turma)+'|'+br];
  if(e){r.st=Object.assign({},r.st,e.st);if(e.na!==undefined)r.na=e.na}
  return r;
}
function chStats(d,dias){
  const st={};d.alunos.forEach(n=>st[n]={aulas:0,p:0,f:0,fj:0,seg:0,fim:false});
  const feitos=dias.filter(x=>!x.feriado).map(x=>({x,r:chDia(d,x.br)})).filter(o=>Object.keys(o.r.st).length);
  feitos.forEach(({x,r})=>{const au=Math.max(0,x.tempos-(r.na?r.na.aulas:0));
    Object.entries(r.st).forEach(([n,v])=>{const s=st[n];if(!s)return;s.aulas+=au;if(v==='P')s.p+=au;else if(v==='F')s.f+=au;else if(v==='FJ')s.fj+=au})});
  // faltas seguidas (dias), contando do registro mais recente para trás
  feitos.slice().reverse().forEach(({r})=>Object.entries(st).forEach(([n,s])=>{if(s.fim)return;const v=r.st[n];if(v==='F')s.seg++;else if(v)s.fim=true}));
  Object.values(st).forEach(s=>s.pct=s.aulas?Math.round(s.p/s.aulas*100):null);
  return {st,feitos:feitos.length};
}

/* guarda a mudança e salva o dia inteiro na planilha 1,2 s depois do último toque */
function chEditar(dia,mud){

async function chSalvarTudo(){

/* ===== Blocos de notas (aba Notas) =====
   Nota 1 (desempenho + caderno) · Nota 2 (atividades) · Nota 3 (prova) → Média regular;
   Recuperação paralela (aulas de aprofundamento) → Final. Reconhecidos pelos cabeçalhos da planilha. */
const BLOCOS=[['n1','Nota 1','N1'],['n2','Nota 2','N2'],['n3','Nota 3','N3'],['mr','Média regular','MR'],['rp','Recuperação paralela','RP'],['fin','Final','FINAL'],['out','Outros','']];
function blocoDe(c){
  const L=c.label.toUpperCase().replace(/\s+/g,' '),top=(c.parts[0]||'').toUpperCase().trim();
  if(/RECUP/.test(L))return 'rp';
  if(/FINAL/.test(L))return 'fin';
  if(/M[ÉE]DIA (REGULAR|GERAL)/.test(L))return 'mr';
  if(/M[ÉE]DIA NOTA 2/.test(L)||top==='NOTA 2')return 'n2';
  if(top==='NOTA 1')return 'n1';
  if(top==='NOTA 3')return 'n3';
  if(/^M[ÉE]DIA$/.test(L.trim()))return 'mr';
  return 'out';
}
function blocos(d){
  if(d._bl)return d._bl;
  const m={};BLOCOS.forEach(([id,nome,sig])=>m[id]={id,nome,sig,cols:[],res:null});
  d.columns.forEach(c=>m[blocoDe(c)].cols.push(c));
  const ultCalc=b=>b.cols.filter(c=>c.calc).slice(-1)[0]||null;
  m.n1.res=ultCalc(m.n1);
  m.n2.res=m.n2.cols.find(c=>/M[ÉE]DIA/i.test(c.label)&&c.calc)||ultCalc(m.n2);
  m.n3.res=m.n3.cols.slice(-1)[0]||null;
  m.mr.res=m.mr.cols.slice(-1)[0]||null;
  m.rp.res=m.rp.cols.find(c=>c.calc&&/M[ÉE]DIA/i.test(c.label))||ultCalc(m.rp);
  m.fin.res=m.fin.cols[0]||null;
  return d._bl=BLOCOS.map(([id])=>m[id]).filter(b=>b.cols.length);
}
/* unidades de lançamento: caixa de "feito" + nota ao lado formam um par */
function unidades(b){
  const ins=b.cols.filter(c=>!c.calc),u=[];
  for(let i=0;i<ins.length;i++){
    const c=ins[i],p=ins[i+1];
    if(c.check&&p&&!p.check&&p.c===c.c+1){
      const nome=(c.parts.length>2?c.parts[c.parts.length-2]+' · ':'')+c.leaf.replace(/^ATIV\.\s*/i,'Ativ. ');
      u.push({nome,cols:[c,p]});i++;
    }else u.push({nome:(c.parts.length>2?c.parts[c.parts.length-2]+' · ':'')+c.leaf,cols:[c]});
  }
  return u;
}
function valBadge(row,col,extra){
  if(!col)return '<span class="calc g-none'+(extra||'')+'">—</span>';
  const v=row.cells[col.c].v;
  return '<span class="calc '+(typeof v==='boolean'?'g-none':grade(v))+(extra||'')+'" data-r="'+row.r+'" data-c="'+col.c+'">'+esc(shown(v))+'</span>';
}

      (tot?'<div class="hint" style="margin-top:8px">À direita do nome: nota do caderno calculada pela planilha.</div>':'');
    $('#colSel').addEventListener('change',e=>{S.colSel[key]=+e.target.value;render()});
    bindControls($('#lst'),byRow(d),byCol(d));

/* Aba Notas: Resumo (todas as notas de todos) · Lançar (por bloco e atividade) · Por aluno (ficha) */

  if(m==='resumo'){
    const res=bl.filter(b=>b.res&&b.id!=='out');

    main.innerHTML=seg+
      '<div class="rs-head" style="'+grid+'">'+res.map(b=>'<span title="'+esc(b.nome)+'">'+esc(b.sig)+'</span>').join('')+'</div>'+
      '<div class="list">'+d.rows.map(r=>'<div class="rs-row tap" data-open="'+r.r+'"><div class="rs-nome"><span class="num">'+esc(r.n)+'</span> '+esc(r.nome)+'</div>'+
        '<div class="rs-vals" style="'+grid+'">'+res.map(b=>valBadge(r,b.res,(b.id==='mr'||b.id==='fin')?' forte':'')).join('')+'</div></div>').join('')+'</div>'+
      '<div class="hint" style="margin-top:8px">N1 desempenho + caderno · N2 atividades · N3 prova · MR média regular · RP recuperação paralela. Toque num aluno para ver como cada nota foi formada.</div>';
    main.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',()=>openSheet(+el.dataset.open)));
  }else if(m==='lancar'){
    const comIns=bl.filter(b=>b.cols.some(c=>!c.calc));
    if(!comIns.length){main.innerHTML=seg+'<div class="empty">Esta aba não tem colunas de lançamento.</div>';bindSeg('mode');return}
    const k=S.turma+'bloco';let b=comIns.find(x=>x.id===S.colSel[k])||comIns[0];S.colSel[k]=b.id;
    const us=unidades(b),ku=S.turma+'un'+b.id;let ui=Math.min(S.colSel[ku]||0,us.length-1);S.colSel[ku]=ui;const u=us[ui];
    main.innerHTML=seg+
      '<div class="chips2" style="grid-template-columns:repeat('+comIns.length+',1fr)">'+comIns.map(x=>'<button class="chip'+(x===b?' on':'')+'" data-b="'+x.id+'">'+esc(x.nome.replace('Recuperação paralela','Recup.'))+'</button>').join('')+'</div>'+
      (us.length>1?'<select id="unSel">'+us.map((x,i)=>'<option value="'+i+'"'+(i===ui?' selected':'')+'>'+esc(x.nome)+'</option>').join('')+'</select>':'<div class="hint">'+esc(u.nome)+'</div>')+
      '<div class="list" id="lst">'+d.rows.map(r=>'<div class="row"><span class="num">'+esc(r.n)+'</span><span class="name">'+esc(r.nome)+'</span>'+
        (b.res&&!u.cols.includes(b.res)?'<span class="ctx" data-r="'+r.r+'" data-c="'+b.res.c+'">'+esc(shown(r.cells[b.res.c].v))+'</span>':'')+
        '<span class="ctl'+(u.cols.length>1?' par':'')+'">'+u.cols.map(c=>control(r,c)).join('')+'</span></div>').join('')+'</div>'+
      (b.res&&!u.cols.includes(b.res)?'<div class="hint" style="margin-top:8px">À direita do nome: '+esc(b.nome)+' atual, calculada pela planilha.</div>':'');
    main.querySelectorAll('[data-b]').forEach(x=>x.addEventListener('click',()=>{S.colSel[k]=x.dataset.b;render()}));
    const us2=$('#unSel');if(us2)us2.addEventListener('change',e=>{S.colSel[ku]=+e.target.value;render()});
    bindControls($('#lst'),byRow(d),byCol(d));
  }else{
    main.innerHTML=seg+'<div class="hint">Toque num aluno para ver e lançar tudo do '+S.cfg.periodo+'º período.</div><div class="list">'+

    main.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',()=>openSheet(+el.dataset.open)));

function bindSeg(qual){
  const io=$('#impOpen');if(io)io.addEventListener('click',abrirImport);
  document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{S[qual]=b.dataset.m;store.set(qual,b.dataset.m);render()}));
}

/* ficha de um aluno: na aba Notas, organizada em blocos com o resultado de cada um */
function fieldsHtml(d,row){
  if(S.kind!=='notas'){
    const groups=[];
    d.columns.forEach(c=>{const g=c.group||c.leaf;let G=groups.find(x=>x.g===g);if(!G){G={g,cols:[]};groups.push(G)}G.cols.push(c)});
    return groups.map(G=>'<div class="grp">'+esc(G.g)+'</div><div class="list">'+
      G.cols.map(c=>'<div class="field"><span class="lb">'+esc(c.leaf)+'</span>'+control(row,c)+'</div>').join('')+'</div>').join('');
  }
  const bl=blocos(d);
  const card=b=>{
    const itens=b.cols.filter(c=>c!==b.res||!c.calc);
    const so=b.res&&(b.id==='mr'||b.id==='fin')&&itens.length<=1;
    if(so)return '<div class="bloco destaque"><span class="bl-nome">'+esc(b.nome)+'</span>'+valBadge(row,b.res,' forte')+'</div>';
    // atividade feita + nota da atividade na mesma linha
    const us=unidades(b),par={},pula={};us.forEach(u=>{if(u.cols.length>1){par[u.cols[0].c]=u;pula[u.cols[1].c]=1}});
    const linhas=itens.filter(c=>!pula[c.c]).map(c=>{
      const u=par[c.c];
      if(u)return '<div class="field"><span class="lb">'+esc(u.nome)+'</span><span class="ctl par">'+u.cols.map(x=>control(row,x)).join('')+'</span></div>';
      return '<div class="field"><span class="lb">'+esc(c.parts.length>2?c.parts[c.parts.length-2]+' · '+c.leaf:c.leaf)+'</span>'+control(row,c)+'</div>';
    });
    return '<div class="bl-head"><span class="grp">'+esc(b.nome)+'</span>'+(b.res&&b.res.calc?valBadge(row,b.res,' forte'):'')+'</div><div class="list">'+linhas.join('')+'</div>';
  };
  const reg=bl.filter(b=>['n1','n2','n3'].includes(b.id)),mr=bl.find(b=>b.id==='mr');
  return '<div class="sec-t">Média regular</div>'+reg.map(card).join('')+(mr?card(mr):'')+
    bl.filter(b=>['rp','fin','out'].includes(b.id)).map(b=>(b.id==='out'?'<div class="sec-t">Outros</div>':'')+card(b)).join('');
}

/* Um aluno por vez: a lista fica recolhida e só aparece o aluno escolhido
   (para mostrar a nota a um estudante sem expor a dos colegas). */
function renderPriv(d){
  const rows=d.rows;if(!rows.length){$('#main').innerHTML='<div class="empty">Nenhum aluno nesta aba.</div>'+foot();bindFoot();return}
  let i=rows.findIndex(r=>r.r===S.privRow);
  if(i<0){i=0;S.privRow=rows[0].r}
  const row=rows[i];
  const nav='<div class="privtag">Um aluno por vez · a lista da turma está recolhida</div>'+
    '<div class="privnav"><button class="iconbtn" id="pPrev" aria-label="Aluno anterior"'+(i?'':' disabled')+'>‹</button>'+
    '<select id="pSel" aria-label="Escolher aluno">'+rows.map(r=>'<option value="'+r.r+'"'+(r.r===row.r?' selected':'')+'>'+esc(r.n)+'. '+esc(r.nome)+'</option>').join('')+'</select>'+
    '<button class="iconbtn" id="pNext" aria-label="Próximo aluno"'+(i<rows.length-1?'':' disabled')+'>›</button></div>';
  let body;
  if(S.kind==='final'){
    const tone=finalTone(d);
    body='<div class="list">'+d.columns.map(c=>{const v=row.cells[c.c].v,t=tone(c,v);return '<div class="field"><span class="lb">'+esc(c.leaf)+'</span>'+(t?'<span class="calc '+t+'">'+esc(shown(v))+'</span>':'<span class="calc g-none">'+esc(shown(v))+'</span>')+'</div>'}).join('')+'</div>';
  }else body=fieldsHtml(d,row);
  $('#main').innerHTML=nav+'<div id="pBody">'+body+'</div>'+foot();
  const go=r=>{if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();S.privRow=r;render();window.scrollTo(0,0)};
  $('#pSel').addEventListener('change',e=>go(+e.target.value));
  $('#pPrev').addEventListener('click',()=>rows[i-1]&&go(rows[i-1].r));
  $('#pNext').addEventListener('click',()=>rows[i+1]&&go(rows[i+1].r));
  if(S.kind!=='final')bindControls($('#pBody'),byRow(d),byCol(d));
  bindFoot();
}

/* ===== Importação das notas dos Google Formulários =====
   Vale só o PRIMEIRO envio de cada aluno; nota = pontos ÷ total × 10. */
const IMP={};
const APP_VERSAO='1.7.0',APP_DATA='2026-10-25';
function impFechar(){$('#imp').classList.remove('open')}
async function abrirImport(){
  $('#imp').classList.add('open');$('#impTit').textContent='Importar dos formulários';$('#impSub').textContent='Turma '+S.turma+' · escolha a atividade';
  $('#impBody').innerHTML='<div class="loading">Procurando os formulários…</div>';
  try{
    const j=await api('formularios',{turma:S.turma}),l=j.lista;
    if(!l.length){$('#impBody').innerHTML='<div class="empty">Nenhum formulário na pasta do período deste ano.</div>';return}
    const badge=f=>f.novas==null?'':f.novas?'<span class="tag duvida">'+f.novas+(f.novas===1?' nova':' novas')+'</span>':'<span class="tag certo">em dia</span>';
    $('#impBody').innerHTML=autoInfo(j.auto)+'<div class="list">'+l.map(f=>'<button class="formbtn" data-f="'+esc(f.id)+'"><span><b>'+esc(f.cap?'Capítulo '+f.cap:'Sem capítulo no título')+' '+badge(f)+'</b><span>'+esc(f.titulo)+'</span></span>›</button>').join('')+'</div>';
    $('#impBody').querySelectorAll('[data-f]').forEach(b=>b.addEventListener('click',()=>previa(b.dataset.f)));
  }catch(e){$('#impBody').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}
}
function autoInfo(a){
  if(!a||!a.quando)return '<div class="hint">A importação automática ainda não rodou. Respostas com nome conferido entram sozinhas de hora em hora; as duvidosas ficam aqui para você conferir.</div>';
  const q=new Date(a.quando).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  return '<div class="hint">Importação automática: última em <b>'+q+'</b>'+(a.log&&a.log.length?' · '+esc(a.log.join(' · ')):' · nada novo')+'. Aqui ficam as respostas que precisam da sua conferência.</div>';
}
async function previa(formId,todas){
  IMP.form=formId;
  $('#impBody').innerHTML='<div class="loading">Lendo as respostas e conferindo os nomes…</div>';
  try{
    const p=(await api('previa',{turma:S.turma,form:formId,todas:!!todas})).previa;
    IMP.p=p;IMP.sel=p.respostas.map(x=>x.feita?'':x.certeza==='repetido'?'x':(x.r||''));
    $('#impTit').textContent='Capítulo '+p.cap+' · turma '+S.turma;
    $('#impSub').textContent=p.titulo;
    renderPrevia();
  }catch(e){$('#impBody').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}
}
function impValidos(){ // vale o primeiro envio de cada aluno (respostas já vêm em ordem de envio)
  const visto={},ok=[];
  IMP.p.respostas.forEach((x,i)=>{const r=+IMP.sel[i];if(!r||visto[r]){return}visto[r]=1;ok.push(i)});
  return ok;
}
function renderPrevia(){
  const p=IMP.p,ok=new Set(impValidos());
  const nomeDe=r=>(p.alunos.find(a=>a.r===+r)||{}).nome||'';
  const opts=(r,i)=>'<option value="">— escolher o aluno —</option><option value="x"'+(IMP.sel[i]==='x'?' selected':'')+'>✕ descartar esta resposta</option>'+p.alunos.map(a=>'<option value="'+a.r+'"'+(+r===a.r?' selected':'')+'>'+esc(a.nome)+'</option>').join('');
  const enviaram=new Set(impValidos().map(i=>+IMP.sel[i]));
  const temNaPlanilha=r=>{const at=p.atual[r]||{};return at.marca===true||(p.cols.nota&&at.nota!=null&&String(at.nota)!=='')};
  const sem=p.alunos.filter(a=>!enviaram.has(a.r)&&!temNaPlanilha(a.r)).length;
  const info='<div class="hint">Grava em <b>'+esc(p.cols.marca.label)+'</b>'+(p.cols.nota?' e a nota em <b>'+esc(p.cols.nota.label)+'</b>':' (só marca quem fez)')+'. Nota = pontos ÷ '+p.total+' × 10. Vale o primeiro envio.</div>';
  const linhas=p.respostas.map((x,i)=>{
    const r=+IMP.sel[i],dup=r&&!ok.has(i),at=r?p.atual[r]:null,desc=IMP.sel[i]==='x',espera=!x.feita&&IMP.sel[i]==='';
    const tag=desc?'<span class="tag nenhum">'+(x.certeza==='repetido'?'aluno já tem nota · será descartada':'será descartada')+'</span>':espera?'<span class="tag nenhum">'+(x.certeza==='nenhum'?'não encontrado · ':'')+'escolha o aluno</span>':x.feita&&!r?'<span class="tag certo">já importada</span>':x.certeza==='repetido'&&!r?'<span class="tag duvida">aluno já tem nota · vale o 1º envio</span>':dup?'<span class="tag duvida">repetido: vale o 1º envio</span>':!r?'<span class="tag nenhum">'+(x.certeza==='nenhum'?'não encontrado':'não importar')+'</span>':x.certeza==='certo'&&r===x.r?'<span class="tag certo">confere</span>':'<span class="tag duvida">confira</span>';
    const atual=at&&p.cols.nota&&at.nota&&String(at.nota)!==''?' · na planilha: '+esc(at.nota):'';
    return '<div class="improw'+(dup||desc||(x.feita&&!r)?' off':'')+'"><div class="imp-t"><b>'+esc(x.nome||'(sem nome)')+'</b><span class="calc '+grade(x.nota==null?'':String(x.nota).replace('.',','))+'">'+(x.nota==null?'—':String(x.nota).replace('.',','))+'</span></div>'+
      '<div class="imp-m">'+new Date(x.quando).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+(x.mesmaTurma===null?' · turma não informada ('+esc(x.turma||'vazio')+')':'')+atual+' '+tag+'</div>'+
      '<select data-i="'+i+'">'+opts(r,i)+'</select></div>';
  }).join('');
  const n=ok.size,novas=p.respostas.map((x,i)=>i).filter(i=>!p.respostas[i].feita);
  const espera=novas.filter(i=>IMP.sel[i]==='').length,desc=novas.filter(i=>IMP.sel[i]==='x').length;
  const pend=n+desc>0;
  const rot=n?'Gravar '+n+' '+(n===1?'nota':'notas')+' na planilha':desc+(desc===1?' resposta será descartada':' respostas serão descartadas')+' · confirmar';
  const vazio=p.jaImportadas&&!p.todas?'<div class="empty"><b>Não há respostas novas.</b><br>A última lista já foi importada ('+p.jaImportadas+(p.jaImportadas===1?' resposta':' respostas')+').</div>':'<div class="empty">Ainda não há respostas desta turma.</div>';
  const verTodas=p.jaImportadas&&!p.todas?'<button class="impbtn" id="impTodas" style="justify-content:center">Ver também as já importadas</button>':'';
  $('#impBody').innerHTML=info+(p.respostas.length?'<div class="list">'+linhas+'</div>':vazio)+verTodas+
    '<div class="hint" style="margin-top:8px">'+sem+' aluno(s) da turma ainda sem esta atividade na planilha.</div>'+
    (espera?'<div class="hint" style="color:var(--low);font-weight:700">'+espera+(espera===1?' resposta aguarda':' respostas aguardam')+' você escolher o aluno. Ela'+(espera===1?'':'s')+' continua'+(espera===1?'':'m')+' na lista até isso.</div>':'')+
    (pend?'<div class="impok"><button id="impGo">'+rot+'</button><div class="hint" style="margin:6px 2px 0">Saem da lista só as importadas e as descartadas.</div></div>':'');
  $('#impBody').querySelectorAll('select[data-i]').forEach(sl=>sl.addEventListener('change',()=>{IMP.sel[+sl.dataset.i]=sl.value;const y=$('#impBody').scrollTop;renderPrevia();$('#impBody').scrollTop=y}));
  const go=$('#impGo');if(go)go.addEventListener('click',gravarImport);
  const vt=$('#impTodas');if(vt)vt.addEventListener('click',()=>previa(IMP.form,true));
}
async function gravarImport(){
  const p=IMP.p,b=$('#impGo');b.disabled=true;b.textContent='Gravando…';
  const itens=impValidos().map(i=>{const r=+IMP.sel[i];return {r,nome:(p.alunos.find(a=>a.r===r)||{}).nome,nota:p.respostas[i].nota}});
  try{
    const processados=p.respostas.filter((x,i)=>!x.feita&&IMP.sel[i]!=='').map(x=>x.id);
    const n=(await api('importar',{turma:S.turma,cols:p.cols,itens,form:IMP.form,processados})).gravadas;
    impFechar();toast(n?(n+(n===1?' nota gravada':' notas gravadas')+' na planilha da '+S.turma+'.'):'Respostas marcadas como conferidas.');
    if(S.data[S.turma]){delete S.data[S.turma].notas;delete S.data[S.turma].final}
    S.colSel[S.turma+'notas']=p.cols.nota?p.cols.nota.c:p.cols.marca.c;
    load(S.turma,'notas');
  }catch(e){toast(e.message);b.disabled=false;b.textContent='Tentar de novo'}
}

function openSheet(r){S.openRow=r;renderSheet();$('#sheet').classList.add('open')}
function renderSheet(){
  const d=cur();if(!d)return;
  const row=d.rows.find(x=>x.r===S.openRow);if(!row)return;
  $('#sName').textContent=row.nome;
  $('#sSub').textContent='Turma '+S.turma+' · nº '+row.n+' · '+d.sheet;
  $('#sBody').innerHTML=fieldsHtml(d,row)+(S.kind==='notas'?obsHtml():'');
  bindControls($('#sBody'),byRow(d),byCol(d));
  if(S.kind==='notas')obsCarregar(row.nome);
}

/* ===== Observações do professor sobre o aluno =====
   Ficam na aba OBSERVAÇÕES da planilha da turma. Nunca aparecem no modo "Um aluno por vez". */
const OBS={};
function obsHtml(){
  return '<div class="sec-t">Observações</div>'+
    '<div class="hint">Só você vê: comportamento, participação, assiduidade… Ajudam a fechar a nota de desempenho. Não aparecem no modo Um aluno por vez.</div>'+
    '<textarea id="obsTxt" class="obs-txt" rows="3" placeholder="Escreva uma observação sobre a aula de hoje…"></textarea>'+
    '<button class="obs-btn" id="obsSalvar">Salvar observação</button>'+
    '<div id="obsList" class="obs-list"><div class="hint">Carregando observações…</div></div>';
}
function obsLista(nome,lista){
  const el=$('#obsList');if(!el||$('#sName').textContent!==nome)return;
  el.innerHTML=lista.length?'<div class="list">'+lista.map(o=>'<div class="obs-it"><div class="obs-q">'+
      esc(new Date(o.quando).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}))+
      '<button class="obs-del" data-l="'+o.linha+'" aria-label="Apagar observação">apagar</button></div><div class="obs-t">'+esc(o.texto).replace(/\n/g,'<br>')+'</div></div>').join('')+'</div>'
    :'<div class="hint">Nenhuma observação ainda.</div>';
  el.querySelectorAll('.obs-del').forEach(b=>b.addEventListener('click',async()=>{
    if(!confirm('Apagar esta observação?'))return;
    b.disabled=true;
    try{const l=(await api('obsDel',{turma:S.turma,nome,linha:+b.dataset.l})).lista;OBS[S.turma+'|'+nome]=l;obsLista(nome,l);toast('Observação apagada.')}
    catch(e){toast(e.message);b.disabled=false}
  }));
}
async function obsCarregar(nome){
  const k=S.turma+'|'+nome;
  if(OBS[k])obsLista(nome,OBS[k]);
  const bt=$('#obsSalvar'),tx=$('#obsTxt');
  if(bt)bt.addEventListener('click',async()=>{
    const texto=tx.value.trim();if(!texto){tx.focus();return}
    bt.disabled=true;bt.textContent='Salvando…';
    try{const l=(await api('obsAdd',{turma:S.turma,nome,texto})).lista;OBS[k]=l;tx.value='';obsLista(nome,l);toast('Observação salva.')}
    catch(e){toast(e.message)}
    bt.disabled=false;bt.textContent='Salvar observação';
  });
  try{const l=(await api('obs',{turma:S.turma,nome})).lista;OBS[k]=l;obsLista(nome,l)}
  catch(e){const el=$('#obsList');if(el)el.innerHTML='<div class="hint">'+esc(e.message)+'</div>'}
}
function stepSheet(dir){
  const d=cur();const i=d.rows.findIndex(x=>x.r===S.openRow);const n=d.rows[i+dir];
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  if(n){S.openRow=n.r;renderSheet();$('#sBody').scrollTop=0}
}

function finalTone(d){
  const p28=d.columns.find(c=>/PARA\s*28/i.test(c.label));
  return (c,v)=>{
    if(p28&&c.c===p28.c){const n=num(v);if(n==null)return '';return n>10?'g-low':n>7?'g-mid':'g-ok'}
    return (c.calc&&num(v)!=null&&/PER[ÍI]ODO|M[ÉE]DIA/i.test(c.label))?grade(v):'';
  };
}
function renderFinal(d){
  const fin=d.columns.find(c=>/M[ÉE]DIA FINAL/i.test(c.label))||keyCols(d).slice(-1)[0];
  const p28=d.columns.find(c=>/PARA\s*28/i.test(c.label));
  const vals=d.rows.map(r=>fin?num(r.cells[fin.c].v):null).filter(v=>v!=null);
  const avg=vals.length?(vals.reduce((a,b)=>a+b,0)/vals.length):null;
  const below=vals.filter(v=>v<7).length;
  const tone=(c,v)=>{
    if(p28&&c.c===p28.c){const n=num(v);if(n==null)return '';return n>10?'g-low':n>7?'g-mid':'g-ok'}
    return (c.calc&&num(v)!=null&&/PER[ÍI]ODO|M[ÉE]DIA/i.test(c.label))?grade(v):'';
  };
  $('#main').innerHTML=
    '<div class="stats"><div class="stat"><b>'+d.rows.length+'</b><span>alunos</span></div>'+
    '<div class="stat"><b>'+(avg==null?'—':avg.toFixed(1).replace('.',','))+'</b><span>média da turma</span></div>'+
    '<div class="stat"><b>'+below+'</b><span>abaixo de 7</span></div></div>'+
    '<div class="tablewrap"><table><thead><tr><th class="nm">Aluno</th>'+d.columns.map(c=>'<th>'+esc(c.leaf.replace(/\s*PER[ÍI]ODO/i,'º P'))+'</th>').join('')+'</tr></thead><tbody>'+
    d.rows.map(r=>'<tr><td class="nm">'+esc(r.nome)+'</td>'+d.columns.map(c=>{const v=r.cells[c.c].v,t=tone(c,v);return '<td>'+(t?'<span class="calc '+t+'">'+esc(shown(v))+'</span>':esc(shown(v)))+'</td>'}).join('')+'</tr>').join('')+
    '</tbody></table></div>'+
    (p28?'<div class="hint" style="margin-top:8px">“Para 28”: quanto falta para somar 28 (média 7). Vermelho = acima de 10, não alcança só com o 4º período.</div>':'')+
    '<div class="hint">Somente leitura: esta aba é calculada na planilha.</div>';
}

/* ---------- navegação ---------- */
function drawChips(){
  $('#chips').innerHTML=S.cfg.turmas.map(t=>'<button class="chip'+(t===S.turma?' on':'')+'" data-t="'+t+'">'+t+'</button>').join('');
  document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{S.turma=b.dataset.t;S.privRow=null;store.set('turma',S.turma);drawChips();ensure()}));
}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{
  S.kind=b.dataset.k;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));ensure();
}));
$('#refresh').addEventListener('click',()=>{if(S.data[S.turma])S.data[S.turma]={};load(S.turma,S.kind)});
$('#sClose').addEventListener('click',()=>{if(document.activeElement)document.activeElement.blur();$('#sheet').classList.remove('open');S.openRow=null;render()});
$('#sPrev').addEventListener('click',()=>stepSheet(-1));
$('#impClose').addEventListener('click',impFechar);
$('#sNext').addEventListener('click',()=>stepSheet(1));

/* ao voltar para o app, puxa o que foi mudado direto na planilha */
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible'||!S.turma)return;
  const d=cur();
  const typing=document.activeElement&&document.activeElement.classList.contains('inp');
  if(d&&!S.pending&&!typing&&Date.now()-new Date(d.fetchedAt)>20000)load(S.turma,S.kind,true);
});

$('#privBtn').addEventListener('click',()=>{
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  setPriv(!S.priv);$('#sheet').classList.remove('open');S.openRow=null;window.scrollTo(0,0);render();
});
setTema(store.get('tema')||'sepia');setPriv(store.get('priv')==='1');

$('#loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const b=$('#entrar');b.disabled=true;b.textContent='Conferindo…';$('#loginErr').textContent='';
  try{
    const tok=(await api('entrar',{senha:$('#senha').value})).token;
    store.set('token',tok);$('#senha').value='';$('#login').classList.remove('open');init();
  }catch(err){$('#loginErr').textContent=err.message||String(err)}
  b.disabled=false;b.textContent='Entrar';
});
$('#logout').addEventListener('click',async()=>{
  const t=store.get('token');store.set('token','');S.data={};
  try{await api('sair',{token:t})}catch(e){}
  $('#main').innerHTML='';showLogin();
});

async function init(){
  if(!store.get('token')){showLogin();return}
  try{
    S.cfg=await api('config');
    $('#sub').textContent=S.cfg.periodo+'º período · '+S.cfg.ano;
    const t=store.get('turma');S.turma=S.cfg.turmas.includes(t)?t:S.cfg.turmas[0];
    S.mode=['resumo','lancar','aluno'].includes(store.get('mode'))?store.get('mode'):'resumo';S.modeC=store.get('modeC')==='aluno'?'aluno':'atividade';
    drawChips();ensure();
  }catch(e){$('#main').innerHTML='<div class="empty">Erro ao iniciar: '+esc(e.message||e)+'</div>'}
}
init();
</script>
</body>
</html>
