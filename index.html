*{box-sizing:border-box}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .choice button{--ct:color-mix(in srgb,var(--yc) 45%,#fff);background:color-mix(in srgb,var(--yc) 22%,var(--surface))}}

.tabs{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,460px);background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:8px max(10px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-right,0px));z-index:5}

<script>
const CFG=window.GEO_CONFIG||{};
const COR={'7':'var(--y7)','8':'var(--y8)','9':'var(--y9)'};
const _n=new Date();const TODAY=new Date(_n.getFullYear(),_n.getMonth(),_n.getDate());
const ISO=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const HOJE=ISO(TODAY);
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const SEM=['dom','seg','ter','qua','qui','sex','sáb'];
const COLORS={y:'Amarelo',g:'Verde',p:'Rosa'};

const store={get(k,d){try{const v=localStorage.getItem('geo:'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('geo:'+k,JSON.stringify(v))}catch(e){}}};

/* Dados: vêm do robô (Google Apps Script) e ficam guardados no celular para abrir sem internet. */
let DATA=store.get('dados',null),LOAD=DATA?'ok':'carregando';
let EMAIL='prof.haroldomatos@gmail.com',YEARS={},TURMAS=[],T2A={};
/* Mensagens de incentivo: vêm da planilha "Mensagens de incentivo do App Geografia". Estas são só a reserva. */
const MSGS={
 resumo:['Parabéns! Copiar este resumo é parte importante da construção da sua nota neste período.'],
 atividade:['Parabéns! O cumprimento desta atividade é muito importante para a construção da sua nota neste período.'],
 unidade:['Incrível! Você copiou todos os resumos da unidade. Seu caderno está pronto para as avaliações.']
};
function aplicarDados(){
  YEARS={};TURMAS=[];T2A={};if(!DATA||!DATA.anos)return;
  for(const a of DATA.anos){
    const units={};a.unidades.forEach(u=>units[u.n]=u);
    YEARS[a.ano]={ano:a.ano,label:a.nome,color:COR[a.ano]||'var(--pen)',atual:a.atual,unit:(units[a.atual]||{}).titulo||'',livro:a.livro,units,list:a.unidades,turmas:a.turmas};
    a.turmas.forEach(t=>{TURMAS.push(t);T2A[t]=a.ano});
  }
  if(DATA.app&&DATA.app.email)EMAIL=DATA.app.email;
  const m=DATA.mensagens||{};for(const k of ['resumo','atividade','unidade'])if(m[k]&&m[k].length)MSGS[k]=m[k];
}
aplicarDados();

/* "Minha turma": a turma do aluno, fixa. Os avisos ficam presos a ela; ver outra turma não muda nada. */
let COMP=store.get('compartilhado',false);
let MINHA=COMP?null:(store.get('minha',null)||(store.get('push',null)||{}).turma||store.get('turma',null));
if(MINHA)store.set('minha',MINHA);
const S={unit:null,tab:'home',turma:COMP?null:MINHA,copied:store.get('copied',{}),sent:store.get('sent',{}),size:store.get('size',1),mode:store.get('mode','auto'),tip:store.get('tip',true),vistos:store.get('vistos',[]),calM:TODAY.getMonth(),calY:TODAY.getFullYear(),sel:TODAY.getDate(),cap:null};
if(DATA&&MINHA&&!TURMAS.includes(MINHA)){MINHA=null;store.set('minha',null)}
if(DATA&&S.turma&&!TURMAS.includes(S.turma))S.turma=null;
let ANN=[],pending=null,editing=null,adjusting=null;

const anoT=()=>T2A[S.turma]||(S.turma||'7')[0];
const capsDe=(y,u)=>((y.units||{})[u]||{caps:[]}).caps;
function capOf(n,y){y=y||Y();const tt=String(n)[0]==='t',k=tt?+String(n).slice(1):+n;for(const u of (y.list||[])){const c=(tt?(u.temas||[]):u.caps).find(x=>x.n==k);if(c)return Object.assign({u:u.n,tema:tt,id:tt?'t'+c.n:c.n},c)}return null}
const capId=v=>/^t\d+$/.test(String(v))?String(v):+v;
const temasDe=(y,u)=>((y.units||{})[u]||{temas:[]}).temas||[];
const pubs=y=>capsDe(y,y.atual).filter(c=>c.resumo);
const agendaT=()=>(((DATA&&DATA.agenda)||{})[S.turma]||[]).slice().sort((x,y)=>(x.data+(x.hora||'')).localeCompare(y.data+(y.hora||''))||(x.cap||0)-(y.cap||0));

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const Y=()=>YEARS[anoT()]||{list:[],units:{}};
const key=n=>anoT()+'-'+n;
const isCopied=n=>!!S.copied[key(n)];
const isSent=n=>!!S.sent[key(n)];
let lastMsg='';
function cheer(kind,sub){
  const pool=MSGS[kind].filter(m=>m!==lastMsg);const msg=pool[Math.floor(Math.random()*pool.length)];lastMsg=msg;
  const title=kind==='unidade'?'Unidade concluída!':'Parabéns!';
  sheet(`<div class="cheer">${kind==='unidade'?'<div class="trophy" aria-hidden="true">★</div>':'<div class="stamp" aria-hidden="true"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M5 12l5 5 9-10"/></svg></div>'}
    <h2>${title}</h2><p>${esc(msg.replace(/^(Parabéns|Muito bem|Ótimo trabalho|Excelente|Mandou bem|Incrível|Unidade concluída|Atividade registrada)! ?/,''))}</p>
    <span class="meta">${esc(sub)}</span>
    <button class="btn btn-primary" data-close>Continuar</button></div>`,o=>{o.classList.add('cheer-wrap');o.querySelector('[data-close]').focus()});
}
const CHEVR='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="flex:none"><path d="M9 6l6 6-6 6"/></svg>';
const CHEVD='<svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
const CHECK='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>';
const CONTOUR='<svg class="contour" viewBox="0 0 100 100" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M20 55c5-18 25-30 42-24s24 22 16 36-30 20-44 14-18-12-14-26z"/><path d="M30 55c4-11 17-18 28-14s15 14 10 23-19 13-28 9-12-8-10-18z"/><path d="M40 55c2-6 9-9 15-7s8 8 5 12-10 7-15 5-6-4-5-10z"/></svg>';

/* Texto do resumo: somente leitura, gerado a partir do Doc */
function md(src){
  const lines=src.trim().split('\n');let out='',list=null,b=0;
  const inline=t=>esc(t).replace(/\*\*([^*]+?)\*\*/g,'<b>$1</b>').replace(/\*([^*]+?)\*/g,'<i>$1</i>').replace(/\*/g,'');
  const close=()=>{if(list){out+=`</${list}>`;list=null}};
  for(const raw of lines){
    const l=raw.replace(/\s+$/,'');if(!l.trim()){close();continue}
    let m;
    if(m=l.match(/^#{1,2}\s+(.*)/)){close();out+=`<h3 class="r-h" data-b="${b++}">${inline(m[1])}</h3>`}
    else if(m=l.match(/^#{3,}\s+(.*)/)){close();out+=`<h4 class="r-h2" data-b="${b++}">${inline(m[1])}</h4>`}
    else if(m=l.match(/^\s*[-•]\s+(.*)/)){if(list!=='ul'){close();out+='<ul>';list='ul'}out+=`<li data-b="${b++}">${inline(m[1])}</li>`}
    else if(m=l.match(/^\d+\.\s+(.*)/)){if(list!=='ol'){close();out+='<ol>';list='ol'}out+=`<li data-b="${b++}">${inline(m[1])}</li>`}
    else{close();out+=`<p data-b="${b++}">${inline(l)}</p>`}
  }
  close();return out;
}

/* Marcações do aluno: guardadas só neste aparelho, por ano e capítulo */
const annKey=()=>'ann:'+key(S.cap);
function loadAnn(){ANN=store.get(annKey(),[])}
function saveAnn(){store.set(annKey(),ANN)}
function paintResumo(){
  const el=$('.resumo'),cc=capOf(S.cap);if(!el||!cc||!cc.resumo)return;
  el.innerHTML=md(cc.resumo);
  const blocks=[...el.querySelectorAll('[data-b]')];
  for(const a of ANN){
    a.lost=false;let t=blocks[a.b]?.textContent;
    if(t!=null&&t.slice(a.s,a.e)===a.q)continue;
    let i=t!=null?t.indexOf(a.q):-1;
    if(i>=0){a.s=i;a.e=i+a.q.length;continue}
    const j=blocks.findIndex(x=>x.textContent.includes(a.q));
    if(j>=0){a.b=j;a.s=blocks[j].textContent.indexOf(a.q);a.e=a.s+a.q.length}else a.lost=true;
  }
  blocks.forEach((blk,bi)=>{
    const list=ANN.filter(a=>!a.lost&&a.b===bi);if(!list.length)return;
    const cuts=new Set();list.forEach(a=>{cuts.add(a.s);cuts.add(a.e)});
    const walker=document.createTreeWalker(blk,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
    let off=0;
    for(let node of nodes){
      const len=node.data.length,start=off;off+=len;
      const inner=[...cuts].filter(c=>c>start&&c<start+len).sort((x,y)=>y-x);
      const pieces=[];let cur=node;
      for(const c of inner){const rest=cur.splitText(c-start);pieces.unshift([rest,c]);}
      pieces.unshift([cur,start]);
      for(let k=0;k<pieces.length;k++){
        const [n,s0]=pieces[k],e0=s0+n.data.length;if(!n.data.length)continue;
        const cov=list.filter(a=>a.s<=s0&&a.e>=e0);if(!cov.length)continue;
        const sp=document.createElement('span');sp.className='ann';
        const hl=[...cov].reverse().find(a=>'ygp'.includes(a.t));if(hl)sp.classList.add('c-'+hl.t);
        if(cov.some(a=>a.t==='u'))sp.classList.add('u');
        if(cov.some(a=>a.t==='n'))sp.classList.add('n');
        sp.dataset.ids=cov.map(a=>a.id).join(' ');
        n.parentNode.insertBefore(sp,n);sp.appendChild(n);
      }
    }
    list.filter(a=>a.note).forEach(a=>{
      const sps=[...blk.querySelectorAll('.ann')].filter(x=>x.dataset.ids.split(' ').includes(a.id));
      const last=sps[sps.length-1];if(!last)return;

function addAnn(t,note,msg){

  const a={id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),b:pending.b,s:pending.s,e:pending.e,q:pending.q,t};

function readSelection(){
  const sel=getSelection();if(!sel||sel.isCollapsed||!sel.rangeCount)return null;
  const r=sel.getRangeAt(0),root=$('.resumo');if(!root||!root.contains(r.commonAncestorContainer))return null;
  const elOf=n=>(n.nodeType===1?n:n.parentElement).closest('[data-b]');
  const b1=elOf(r.startContainer);if(!b1)return null;const b2=elOf(r.endContainer);
  const pre=document.createRange();pre.setStart(b1,0);pre.setEnd(r.startContainer,r.startOffset);
  let s=pre.toString().length,e;
  if(b2===b1){const p2=document.createRange();p2.setStart(b1,0);p2.setEnd(r.endContainer,r.endOffset);e=p2.toString().length}
  else e=b1.textContent.length;
  const full=b1.textContent;while(s<e&&/\s/.test(full[s]))s++;while(e>s&&/\s/.test(full[e-1]))e--;
  if(e-s<2)return null;
  return {b:+b1.dataset.b,s,e,q:full.slice(s,e),clipped:b2!==b1};
}

const listaT=ts=>ts.length>1?ts.slice(0,-1).join(', ')+' e '+ts[ts.length-1]:ts[0]||'';
function b64u8(s){const p='='.repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))}
async function avisarSW(turmas){try{const c=await caches.open('geo-push');await c.put('turma',new Response([].concat(turmas||[]).join(',')));await c.put('dataurl',new Response(CFG.DATA_URL||''))}catch(e){}}
async function enviarInscricao(sub,turmas,acao){
  turmas=[].concat(turmas||[]);
  let r,txt;
  try{r=await fetch(CFG.DATA_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({acao:acao||'inscrever',turma:turmas[0],turmas,sub:sub.toJSON?sub.toJSON():sub})});txt=await r.text()}
  catch(e){const x=new Error('sem conexão com o robô');x.etapa='rede';throw x}
  let j;try{j=JSON.parse(txt)}catch(e){const x=new Error(/doPost/i.test(txt)?'o robô ainda não tem a parte de avisos publicada':'resposta inesperada do robô');x.etapa='robo';throw x}
  if(!j.ok){const x=new Error(j.erro||'falha');x.etapa='robo';throw x}
}
async function ativarPush(lista){
  if(!pushOk()||!(DATA&&DATA.push&&DATA.push.chave))return toast('Este celular não aceita avisos.');
  store.set('querPush',true);
  const perm=await Notification.requestPermission();
  if(perm!=='granted'){render();return toast(perm==='denied'?'Avisos bloqueados. Toque em "Como liberar" para ativar.':'Os avisos não foram ativados. Toque de novo quando quiser.')}
  try{
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub){try{sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u8(DATA.push.chave)})}catch(e){const x=new Error('o celular recusou a inscrição ('+(e&&e.name||'erro')+')');x.etapa='celular';throw x}}
    const ts=lista&&lista.length?lista:[MINHA||S.turma];
    await enviarInscricao(sub,ts);await avisarSW(ts);
    PUSH={turmas:ts,endpoint:sub.endpoint};store.set('push',PUSH);render();
    toast(ts.length>1?'Avisos ativados para as turmas '+listaT(ts)+'.':'Avisos ativados para a turma '+ts[0]+'.');
  }catch(e){
    const msg=e&&e.etapa==='rede'?'Sem conexão. Tente de novo com internet.':'Não foi possível ativar os avisos.';
    sheet(`<h2>Avisos não ativados</h2><p style="margin:0">${msg}</p><p class="meta" style="margin:0">Detalhe para o professor: <b>${esc((e&&e.etapa||'?')+' · '+(e&&e.message||e))}</b></p><button class="btn btn-primary" data-close>Ok</button>`);
  }
}
async function desativarPush(){
  try{const reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.getSubscription();if(sub){enviarInscricao(sub,PUSH?PUSH.turmas:[],'remover').catch(()=>{});await sub.unsubscribe()}}catch(e){}
  PUSH=null;store.set('push',null);store.set('querPush',false);render();toast('Avisos desativados. Para ativar de novo, toque em "Ativar avisos".');
}
async function conferirPush(){
  if(!PUSH||!pushOk())return;
  try{const reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.getSubscription();
    if(!sub||Notification.permission!=='granted'){PUSH=null;store.set('push',null);render();return}
    if(MINHA&&(PUSH.turmas.length!==1||PUSH.turmas[0]!==MINHA)){await enviarInscricao(sub,[MINHA]);PUSH.turmas=[MINHA];store.set('push',PUSH);await avisarSW([MINHA])}
  }catch(e){}
}

function sharePdf(){
  const y=Y(),c=capOf(S.cap),url=c.pdf;
  const title=c.tema?`Aula de Geografia · ${y.label} · Tema Transversal ${c.n}: ${c.titulo}`:`Resumo de Geografia · ${y.label} · Cap. ${c.n}: ${c.titulo}`;
  const text=`${title} (PDF)`;
  const fallback=()=>{
    const msg=encodeURIComponent(text+'\n'+url);
    sheet(`<h2>Compartilhar resumo</h2><p class="meta" style="margin:0">${esc(title)}</p>
      <div class="share-grid">
        <a class="share-opt" href="https://wa.me/?text=${msg}" target="_blank" rel="noopener"><span class="si" style="background:#25D366">W</span>WhatsApp</a>
        <a class="share-opt" href="https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(text)}" target="_blank" rel="noopener"><span class="si" style="background:#229ED9">T</span>Telegram</a>
        <a class="share-opt" href="mailto:?subject=${encodeURIComponent(title)}&body=${msg}"><span class="si" style="background:var(--pen)">@</span>E-mail</a>
        <button class="share-opt" id="shCopy"><span class="si" style="background:var(--muted)">⧉</span>Copiar link</button>
      </div>
      <button class="btn btn-ghost" data-close>Fechar</button>`,
    o=>{o.querySelector('#shCopy').onclick=()=>{try{navigator.clipboard.writeText(url).then(()=>toast('Link copiado.'),()=>toast(url))}catch(e){toast(url)}}});
  };
  if(navigator.share){navigator.share({title,text,url}).catch(e=>{if(e&&e.name==='AbortError')return;fallback()})}
  else fallback();
}

function vCalendario(){
  const y=S.calY,m=S.calM,first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),ag=agendaT();
  const pref=y+'-'+String(m+1).padStart(2,'0')+'-';
  let cells=SEM.map(d=>`<div class="dow">${d[0].toUpperCase()}</div>`).join('')+'<div></div>'.repeat(first);
  for(let d=1;d<=n;d++){
    const iso=pref+String(d).padStart(2,'0'),evs=ag.filter(e=>e.data===iso);
    const isT=iso===HOJE;
    cells+=`<button class="day${isT?' today':''}${d===S.sel?' sel':''}${evs.length?' has':''}" data-day="${d}" aria-label="${d} de ${MESES[m]}${evs.length?', '+evs.length+' data(s) marcada(s)':''}">${d}${evs.length?`<i class="dots">${evs.slice(0,3).map(e=>`<u class="${TIPO[e.tipo][1]}"></u>`).join('')}</i>`:''}</button>`;
  }
  const dsel=new Date(y,m,S.sel),isoSel=ISO(dsel),doDia=ag.filter(e=>e.data===isoSel),prox=proximos(4).filter(e=>e.data!==isoSel);
  return `<section class="section">
    <div><span class="ypill">${Y().label}</span><h1 style="margin-top:6px">Calendário Turma ${esc(S.turma)}</h1></div>
    <div class="card" style="display:flex;flex-direction:column;gap:10px">
      <div class="cal-head"><button class="icon-btn" id="prevM" aria-label="Mês anterior"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
      <h2 style="text-transform:capitalize">${MESES[m]} ${y}</h2>
      <button class="icon-btn" id="nextM" aria-label="Próximo mês"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button></div>
      <div class="grid7">${cells}</div>
      <div class="legend"><span><u class="ev-caderno"></u>Caderno</span><span><u class="ev-atv"></u>Atividade</span><span><u class="ev-aval"></u>Avaliação</span><span><u class="ev-tema"></u>Tema</span><span><u class="ev-aviso"></u>Aviso</span></div>
    </div>
    <h3>${(SEM[dsel.getDay()]+', '+S.sel+' de '+MESES[m]).replace(/^./,c=>c.toUpperCase())}</h3>
    ${doDia.length?`<div class="evlist">${doDia.map(evCard).join('')}</div>`:`<div class="card empty-card"><b>Nada marcado para este dia</b></div>`}
    ${prox.length?`${sec('Próximas datas','pen','cal')}<div class="evlist">${prox.map(evCard).join('')}</div>`:''}
  </section>`;
}

  const tl=document.querySelector('[data-tab=turma] .tl');if(tl)tl.textContent=S.turma?'Turma '+S.turma:'Turma';
  const dot=document.querySelector('[data-tab=turma]');if(dot)dot.classList.toggle('has-new',!!(S.turma&&DATA&&avisosNovos().length));
  document.body.classList.remove('y7','y8','y9','my7','my8','my9');if(S.turma&&S.tab!=='home')document.body.classList.add('y'+anoT());if(MINHA&&T2A[MINHA])document.body.classList.add('my'+T2A[MINHA]);
  $('#view').innerHTML=S.cap?vCap(S.cap):{home:vHome,turma:vTurma,resumos:vResumos,atividades:vAtividades,calendario:vCalendario}[S.tab]();
  if(MINHA&&S.turma&&S.turma!==MINHA&&S.tab!=='home'&&S.tab!=='turma')$('#view').insertAdjacentHTML('afterbegin',`<div class="outra mini"><span>Vendo a <b>Turma ${esc(S.turma)}</b> · sua turma é a ${esc(MINHA)}</span><button class="link" data-turma="${esc(MINHA)}">Voltar</button></div>`);
  if(S.cap){loadAnn();paintResumo()}
  document.querySelectorAll('.tab').forEach(b=>{b.removeAttribute('aria-current');if(b.dataset.tab===S.tab)b.setAttribute('aria-current','page')});
}
/* Menu de turmas: abre para cima a partir da aba Turma */
function fecharTurmas(){const m=document.querySelector('.tmenu');if(m){m.remove();const b=document.querySelector('[data-tab=turma]');if(b)b.setAttribute('aria-expanded','false')}}
function abrirTurmas(btn){
  fecharTurmas();
  const m=document.createElement('div');m.className='tmenu';m.setAttribute('role','menu');m.setAttribute('aria-label','Escolher turma');
  m.innerHTML=`<span class="eyebrow">Ir para a turma</span>`+Object.values(YEARS).map(y=>`<div class="tm-ano" style="--yc:${y.color}"><b>${y.label}</b><div class="tm-ts">${y.turmas.map(t=>`<button role="menuitem" data-turma="${t}"${t===S.turma?' aria-current="true"':''}>${t}${t===MINHA?'<small>minha</small>':t===S.turma?'<small>vendo</small>':''}</button>`).join('')}</div></div>`).join('');
  document.body.appendChild(m);
  const bar=document.querySelector('.tabs').getBoundingClientRect(),r=btn.getBoundingClientRect();
  m.style.bottom=(innerHeight-bar.top+8)+'px';
  const w=m.offsetWidth,left=Math.max(bar.left+8,Math.min(r.left+r.width/2-w/2,bar.right-8-w));
  m.style.left=left+'px';m.style.setProperty('--ax',(r.left+r.width/2-left)+'px');
  btn.setAttribute('aria-expanded','true');
  (m.querySelector('[aria-current]')||m.querySelector('button')).focus({preventScroll:true});
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')fecharTurmas()});
addEventListener('scroll',()=>fecharTurmas(),{passive:true});
function toast(msg,undo){
  document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');
  t.innerHTML=`<span>${esc(msg)}</span>`+(undo?'<button class="undo">Desfazer</button>':'');
  if(undo)t.querySelector('.undo').onclick=()=>{t.remove();undo()};
  document.body.appendChild(t);setTimeout(()=>t.remove(),undo?6000:2400);
}
function go(tab,cap){if(adjusting)cancelAdjust();S.tab=tab;S.cap=cap||null;render();scrollTo(0,0)}

/* Baixa os dados do robô */
let fetching=false,lastFetch=0,pendingRender=false;
async function carregar(){
  if(!CFG.DATA_URL){if(!DATA){LOAD='sem-url';render()}return}
  if(fetching)return;fetching=true;lastFetch=Date.now();
  try{
    const r=await fetch(CFG.DATA_URL+(CFG.DATA_URL.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store'});
    const j=await r.json();
    if(j&&j.anos){
      const mudou=!DATA||DATA.versao!==j.versao;
      DATA=j;store.set('dados',j);LOAD='ok';aplicarDados();
      if(S.turma&&!TURMAS.includes(S.turma)){S.turma=null;S.tab='home';S.cap=null}
      if(mudou){if(S.cap||adjusting||pending||editing)pendingRender=true;else{const y=scrollY;render();scrollTo(0,y)}}
    }
  }catch(e){if(!DATA){LOAD='offline';render()}}
  finally{fetching=false}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Date.now()-lastFetch>60e3)carregar()});
setInterval(()=>{if(document.visibilityState==='visible')carregar()},3*60e3);

let selTimer=null;
document.addEventListener('selectionchange',()=>{
  if(!S.cap)return;clearTimeout(selTimer);
  selTimer=setTimeout(()=>{const p=readSelection();if(p){pending=p;editing=null;showBar(adjusting?'adjust':'new')}},180);
});

document.addEventListener('click',ev=>{
  const t=ev.target;
  if(t.closest('.overlay')||t.closest('.markbar'))return;
  if(document.querySelector('.tmenu')&&!t.closest('.tmenu')){const onTab=t.closest('[data-tab=turma]');fecharTurmas();if(onTab)return;if(!t.closest('.tab'))return}
  const collapsed=getSelection().isCollapsed;
  const pin=t.closest('.pin');if(pin){viewNote(pin.dataset.note);return}
  const sp=t.closest('.ann');if(sp&&getSelection().isCollapsed&&!adjusting){const ids=sp.dataset.ids.split(' ');const k=ids.indexOf(editing);editing=k>0?ids[k-1]:ids[ids.length-1];pending=null;showBar('edit');if(ids.length>1)toast('Há '+ids.length+' marcações aqui. Toque de novo para editar a outra.');return}
  if(pendingRender&&(t.closest('.tab')||t.closest('[data-back]')||t.closest('[data-go]')))pendingRender=false;
  const tab=t.closest('.tab');if(tab){if(tab.dataset.tab==='turma')return abrirTurmas(tab);return go(tab.dataset.tab)}
  const g=t.closest('[data-go]');if(g)return go(g.dataset.go);
  const un=t.closest('[data-unit]');if(un){S.unit=+un.dataset.unit;return go('resumos')}
  const ac=t.closest('[data-act]');if(ac){const id=capId(ac.dataset.act),cc=capOf(id);S.unit=cc?cc.u:null;go('resumos',id);const b=$('#actBox');if(b){b.scrollIntoView({block:'start'});b.classList.add('flash-act');setTimeout(()=>b.classList.remove('flash-act'),1400)}return}
  const jp=t.closest('[data-jump]');if(jp){const b=$('#actBox');if(b){b.scrollIntoView({block:'start',behavior:'smooth'});b.classList.add('flash-act');setTimeout(()=>b.classList.remove('flash-act'),1400)}return}
  const avi=t.closest('[data-aviso]');if(avi)marcarVisto([avi.dataset.aviso]);
  const cap=t.closest('[data-cap]');if(cap){const id=capId(cap.dataset.cap),c=capOf(id);if(c)S.unit=c.u;return go('resumos',id)}
  if(t.closest('[data-back]'))return go('resumos');
  const day=t.closest('[data-day]');if(day){S.sel=+day.dataset.day;return render()}
  if(t.closest('#prevM')||t.closest('#nextM')){const d=t.closest('#prevM')?-1:1;S.calM+=d;if(S.calM<0){S.calM=11;S.calY--}if(S.calM>11){S.calM=0;S.calY++}S.sel=1;return render()}
  if(t.closest('#sharePdf'))return sharePdf();
  if(t.closest('#readBtn'))return readSheet();
  if(t.closest('#listBtn'))return listSheet();
  if(t.closest('#tipOk')){S.tip=false;store.set('tip',false);t.closest('.tip').remove();return}
  if(t.closest('#avisosOk')){marcarVisto(avisosNovos().map(a=>a.id));return render()}
  if(t.closest('#modeBtn'))return modeSheet();
  if(t.closest('#pushOn'))return ativarPush();
  if(t.closest('#pushOff'))return desativarPush();
  if(t.closest('#pushHelp'))return pushHelp();
  if(t.closest('#pushRecheck'))return rechecarPush(true);
  if(t.closest('#retryBtn')){LOAD='carregando';render();return carregar()}
  if(t.closest('#installBtn')){if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.finally(()=>{deferredPrompt=null})}else installHelp();return}
  if(t.closest('#copyBtn')){const k=key(S.cap),c=capOf(S.cap);let gain=false;if(S.copied[k])delete S.copied[k];else{S.copied[k]=true;gain=true}store.set('copied',S.copied);const y=scrollY;render();scrollTo(0,y);
    if(gain&&c.tema){cheer('resumo',`Aula do Tema Transversal ${c.n} registrada como estudada.`);return}
    if(gain){const all=pubs(Y()).every(x=>isCopied(x.n));all&&c.u===Y().atual?cheer('unidade',`Todos os resumos da Unidade ${c.u} copiados no caderno.`):cheer('resumo',`Resumo do Capítulo ${c.n} registrado como copiado.`)}return}
  const sb=t.closest('#sentBtn')||t.closest('[data-sent]');if(sb){const n=sb.dataset.sent?capId(sb.dataset.sent):S.cap,k=key(n);let gain=false;if(S.sent[k])delete S.sent[k];else{S.sent[k]=true;gain=true}store.set('sent',S.sent);const y=scrollY;render();scrollTo(0,y);
    if(gain)cheer('atividade',String(n)[0]==='t'?`Atividade do Tema Transversal ${String(n).slice(1)} registrada.`:`Atividade do Capítulo ${n} registrada como enviada.`);return}
  const tb=t.closest('[data-turma]');if(tb){S.turma=tb.dataset.turma;S.unit=null;store.set('turma',S.turma);
    go('turma');if(!MINHA&&!COMP)perguntarTurma(S.turma);return}
  if(t.closest('#pushTurmas'))return turmasSheet();
  if(t.closest('#celComp')){sheet(`<h2>Usar como celular compartilhado?</h2><p style="margin:0">A turma ${esc(MINHA)} deixa de ser fixa. O app passa a abrir na escolha de turmas e a barra volta às cores padrão.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-primary" id="ccSim">Sim, é compartilhado</button><button class="btn btn-ghost" data-close>Cancelar</button></div>`,(o,close)=>{o.querySelector('#ccSim').onclick=()=>{close();COMP=true;MINHA=null;store.set('compartilhado',true);store.set('minha',null);render();toast('Modo celular compartilhado ativado.')}});return}
  if(t.closest('#celFixar')){COMP=false;store.set('compartilhado',false);render();toast('Toque na sua turma para fixá-la.');return}
  if(t.closest('#mudarMinha')){const nova=S.turma;sheet(`<h2>Mudar a sua turma?</h2><p style="margin:0">Hoje a sua turma é a <b>${esc(MINHA)}</b>. Se mudar para a <b>${esc(nova)}</b>, o app passa a abrir nela${PUSH?' e os avisos no celular passam a ser os da turma '+esc(nova):''}.</p><p class="meta" style="margin:0">Só mude se você realmente estuda na turma ${esc(nova)}.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-primary" id="mmSim">Sim, minha turma é a ${esc(nova)}</button><button class="btn btn-ghost" data-close>Cancelar</button></div>`,(o,close)=>{o.querySelector('#mmSim').onclick=()=>{close();MINHA=nova;COMP=false;store.set('compartilhado',false);store.set('minha',MINHA);render();conferirPush();toast('Agora a sua turma é a '+MINHA+'.')}});return}
  if(t.closest('#copyMail')){try{navigator.clipboard.writeText(EMAIL).then(()=>toast('E-mail copiado.'),()=>toast(EMAIL))}catch(e){toast(EMAIL)}return}
  if(collapsed&&!adjusting&&(pending||editing))clearSel();
});

/* Abrir na tela certa ao tocar num aviso */
function abrirDeAviso(o){
  if(!o||!DATA)return;
  if(o.turma&&TURMAS.includes(o.turma)){S.turma=o.turma;store.set('turma',S.turma)}
  if(!S.turma)return;
  const tab=['turma','resumos','atividades','calendario'].includes(o.ir)?o.ir:'turma';
  const c=o.cap?capOf(capId(o.cap)):null;
  if(c&&c.resumo&&tab==='resumos'){S.unit=c.u;go('resumos',c.id)}else go(tab);
}
(()=>{const q=new URLSearchParams(location.search);if(q.get('ir')||q.get('turma')){const o={ir:q.get('ir'),turma:q.get('turma'),cap:q.get('cap')};history.replaceState(null,'',location.pathname);applyMode();render();abrirDeAviso(o)}})();
if('serviceWorker' in navigator)navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.geoAbrir)abrirDeAviso(e.data.geoAbrir)});
applyMode();if(!document.querySelector('#view').innerHTML)render();carregar().then(conferirPush);
if('serviceWorker' in navigator&&location.protocol==='https:')addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
